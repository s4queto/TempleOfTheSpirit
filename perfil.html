<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet' integrity="sha384-42kyIPf7HDYLkGffmxDhSx/3Z/53wGBs3nD6wEFxsbeDc7rMO6mkYbkAcpRsnMU2" crossorigin="anonymous">
    <title>Temple of the Spirit</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="i18n.js"></script>
</head>
<body>
    <main class="container" id="conteudo" style="display: none;">

        <nav class="topo">
            <span id="saudacao"></span>
            <span>
                <a href="home.html" data-i18n="geral.tarefas">Tarefas</a>
                <a href="#" onclick="sair()" data-i18n="geral.sair">Sair</a>
            </span>
        </nav>

        <h1 data-i18n="perfil.titulo">Meu perfil</h1>

        <form onsubmit="return false;">
            <div class="input-box">
                <input placeholder="Nome" data-i18n-placeholder="geral.nome" type="text" id="nome">
                <i class="bx bxs-user"></i>
            </div>

            <div class="input-box">
                <input placeholder="E-mail" data-i18n-placeholder="geral.email" type="email" id="email">
                <i class="bx bxs-envelope"></i>
            </div>

            <button type="submit" class="login" onclick="salvarPerfil()" style="margin-top: 0;" data-i18n="geral.salvarAlteracoes">Salvar alterações</button>
        </form>

        <hr style="margin: 30px 0; border: none; border-top: 1px solid rgba(255, 255, 255, .2);">

        <h1 style="font-size: 22px;" data-i18n="geral.alterarSenha">Alterar senha</h1>

        <form onsubmit="return false;">
            <div class="input-box">
                <input placeholder="Senha atual" data-i18n-placeholder="geral.senhaAtual" type="password" id="senhaAtual">
                <i class="bx bxs-lock-alt"></i>
            </div>

            <div class="input-box">
                <input placeholder="Nova senha" data-i18n-placeholder="geral.novaSenha" type="password" id="novaSenha">
                <i class="bx bxs-lock-alt"></i>
            </div>

            <button type="submit" class="login" onclick="alterarSenha()" style="margin-top: 0;" data-i18n="geral.alterarSenha">Alterar senha</button>
        </form>

        <p id="mensagem" style="text-align: center; margin-top: 20px;"></p>
    </main>

    <script src="auth.js"></script>
    <script>
        async function carregarPerfil() {
            try {
                const resposta = await chamarApi('/perfil');
                if (!resposta) return;

                const dados = await resposta.json();
                if (dados.usuario.idioma !== idiomaAtual()) definirIdioma(dados.usuario.idioma);

                document.getElementById('saudacao').textContent = t('geral.ola', { nome: dados.usuario.nome });
                document.getElementById('nome').value = dados.usuario.nome;
                document.getElementById('email').value = dados.usuario.email;
                document.getElementById('conteudo').style.display = 'block';

            } catch (erro) {
                alert(t('geral.erroServidor'));
            }
        }

        async function salvarPerfil() {
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const mensagem = document.getElementById('mensagem');

            if (!nome || !email) {
                mensagem.textContent = t('perfil.preenchaNomeEmail');
                return;
            }

            const resposta = await chamarApi('/perfil', {
                method: 'PUT',
                body: JSON.stringify({ nome, email })
            });
            if (!resposta) return;

            const dados = await resposta.json();

            if (!resposta.ok) {
                mensagem.textContent = dados.erro;
                return;
            }

            document.getElementById('saudacao').textContent = t('geral.ola', { nome: dados.usuario.nome });
            mensagem.textContent = dados.mensagem;
        }

        async function alterarSenha() {
            const senhaAtual = document.getElementById('senhaAtual').value;
            const novaSenha = document.getElementById('novaSenha').value;
            const mensagem = document.getElementById('mensagem');

            if (!senhaAtual || !novaSenha) {
                mensagem.textContent = t('perfil.informeSenhas');
                return;
            }

            const resposta = await chamarApi('/alterar-senha', {
                method: 'PUT',
                body: JSON.stringify({ senhaAtual, novaSenha })
            });
            if (!resposta) return;

            const dados = await resposta.json();

            if (!resposta.ok) {
                mensagem.textContent = dados.erro;
                return;
            }

            mensagem.textContent = dados.mensagem;
            document.getElementById('senhaAtual').value = '';
            document.getElementById('novaSenha').value = '';
        }

        carregarPerfil();
    </script>

</body>
</html>
