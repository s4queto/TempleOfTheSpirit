<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet' integrity="sha384-42kyIPf7HDYLkGffmxDhSx/3Z/53wGBs3nD6wEFxsbeDc7rMO6mkYbkAcpRsnMU2" crossorigin="anonymous">
    <title>Login</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <form onsubmit="return false;">
            <h1>Login</h1>
            <div class="input-box">
                <input placeholder="Usuário" type="email" id="email">
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input placeholder="Senha" type="password" id="senha">
                <i class="bx bxs-lock-alt"></i>
            </div>

            <div class="remember-forgot">
                <label>
                <input type="checkbox">
                Lembrar senha
                </label>
                <a href="#" onclick="esqueciSenha()">Esqueci a senha</a>
            </div>

             <p id="mensagem" style="text-align: center; margin-top: 30px;"></p>

            <button type="submit" class="login" onclick="fazerLogin()">Login</button>

            <div class="register-link">
                <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
            </div>

        </form>

    </main>

    <script>
        async function fazerLogin() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const mensagem = document.getElementById('mensagem');

            if (!email || !senha) {
                mensagem.textContent = 'Preencha e-mail e senha.';
                return;
            }

            try {
                const resposta = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    mensagem.textContent = dados.erro;
                    return;
                }

                localStorage.setItem('token', dados.token);

                mensagem.textContent = `Bem-vindo, ${dados.nome}!`;

                window.location.href = 'app.html';

            } catch (erro) {
                mensagem.textContent = 'Erro ao conectar com o servidor.';
            }
        }

        async function esqueciSenha() {
            const email = prompt('Digite seu e-mail cadastrado:');

            if (!email) return;

            try {
                const resposta = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const dados = await resposta.json();
                alert(dados.mensagem);

            } catch (erro) {
                alert('Erro ao conectar com o servidor.');
            }
        }
    </script>

</body>
</html>
