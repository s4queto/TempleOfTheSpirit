<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet' integrity="sha384-42kyIPf7HDYLkGffmxDhSx/3Z/53wGBs3nD6wEFxsbeDc7rMO6mkYbkAcpRsnMU2" crossorigin="anonymous">
    <title>Temple of the Spirit</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="i18n.js"></script>
</head>
<body>
    <main class="container">
        <form onsubmit="return false;">
            <h1 data-i18n="login.titulo">Login</h1>
            <div class="input-box">
                <input placeholder="Usuário" data-i18n-placeholder="login.usuario" type="email" id="email">
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input placeholder="Senha" data-i18n-placeholder="geral.senha" type="password" id="senha">
                <i class="bx bxs-lock-alt"></i>
            </div>

            <div class="remember-forgot">
                <label>
                <input type="checkbox">
                <span data-i18n="login.lembrar">Lembrar senha</span>
                </label>
                <a href="#" onclick="esqueciSenha()" data-i18n="login.esqueci">Esqueci a senha</a>
            </div>

             <p id="mensagem" style="text-align: center; margin-top: 30px;"></p>

            <button type="submit" class="login" onclick="fazerLogin()" data-i18n="login.botao">Login</button>

            <div class="register-link">
                <p><span data-i18n="login.semConta">Não tem uma conta?</span> <a href="cadastro.html" data-i18n="login.cadastreSe">Cadastre-se</a></p>
            </div>

        </form>

    </main>

    <script>
        async function fazerLogin() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const mensagem = document.getElementById('mensagem');

            if (!email || !senha) {
                mensagem.textContent = t('login.preencha');
                return;
            }

            try {
                const resposta = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Idioma': idiomaAtual() },
                    body: JSON.stringify({ email, senha })
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    mensagem.textContent = dados.erro;
                    return;
                }

                localStorage.setItem('token', dados.token);
                if (dados.idioma) definirIdioma(dados.idioma);

                mensagem.textContent = t('login.bemVindo', { nome: dados.nome });

                window.location.href = 'app.html';

            } catch (erro) {
                mensagem.textContent = t('geral.erroServidor');
            }
        }

        async function esqueciSenha() {
            const email = prompt(t('login.digiteEmail'));

            if (!email) return;

            try {
                const resposta = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Idioma': idiomaAtual() },
                    body: JSON.stringify({ email })
                });

                const dados = await resposta.json();
                alert(dados.mensagem);

            } catch (erro) {
                alert(t('geral.erroServidor'));
            }
        }
    </script>

</body>
</html>
