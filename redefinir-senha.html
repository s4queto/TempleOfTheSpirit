<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet' integrity="sha384-42kyIPf7HDYLkGffmxDhSx/3Z/53wGBs3nD6wEFxsbeDc7rMO6mkYbkAcpRsnMU2" crossorigin="anonymous">
    <title>Temple of the Spirit</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="i18n.js"></script>
</head>
<body>
    <main class="container">
        <form onsubmit="return false;">
            <h1 data-i18n="redefinir.titulo">Nova Senha</h1>

            <div class="input-box">
                <input placeholder="Nova senha" data-i18n-placeholder="geral.novaSenha" type="password" id="novaSenha">
                <i class="bx bxs-lock-alt"></i>
            </div>

            <div class="input-box">
                <input placeholder="Confirmar nova senha" data-i18n-placeholder="redefinir.confirmar" type="password" id="confirmarSenha">
                <i class="bx bxs-lock-alt"></i>
            </div>

            <p id="mensagem" style="text-align: center; margin-top: -10px;"></p>

            <button type="submit" class="login" onclick="redefinirSenha()" data-i18n="redefinir.botao">Salvar nova senha</button>

            <div class="register-link">
                <p><a href="index.html" data-i18n="redefinir.voltar">Voltar para o login</a></p>
            </div>

        </form>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        async function redefinirSenha() {
            const novaSenha = document.getElementById('novaSenha').value;
            const confirmarSenha = document.getElementById('confirmarSenha').value;
            const mensagem = document.getElementById('mensagem');

            if (!novaSenha || !confirmarSenha) {
                mensagem.textContent = t('redefinir.preencha');
                return;
            }

            if (novaSenha !== confirmarSenha) {
                mensagem.textContent = t('geral.senhasNaoCoincidem');
                return;
            }

            if (!token) {
                mensagem.textContent = t('redefinir.linkInvalido');
                return;
            }

            try {
                const resposta = await fetch('/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Idioma': idiomaAtual() },
                    body: JSON.stringify({ token, novaSenha })
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    mensagem.textContent = dados.erro;
                    return;
                }

                mensagem.textContent = dados.mensagem + ' ' + t('geral.redirecionando');

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);

            } catch (erro) {
                mensagem.textContent = t('geral.erroServidor');
            }
        }
    </script>

</body>
</html>
