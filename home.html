<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet' integrity="sha384-42kyIPf7HDYLkGffmxDhSx/3Z/53wGBs3nD6wEFxsbeDc7rMO6mkYbkAcpRsnMU2" crossorigin="anonymous">
    <title>Temple of the Spirit</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="i18n.js"></script>
</head>
<body>
    <main class="container container-largo" id="conteudo" style="display: none;">

        <nav class="topo">
            <span id="saudacao"></span>
            <span>
                <a href="perfil.html" data-i18n="geral.perfil">Perfil</a>
                <a href="#" onclick="sair()" data-i18n="geral.sair">Sair</a>
            </span>
        </nav>

        <h1 data-i18n="tarefas.titulo">Minhas tarefas</h1>

        <form onsubmit="return false;">
            <div class="input-box">
                <input placeholder="Nova tarefa" data-i18n-placeholder="tarefas.nova" type="text" id="titulo" maxlength="100">
                <i class="bx bxs-edit"></i>
            </div>

            <div class="input-box">
                <input placeholder="Descrição (opcional)" data-i18n-placeholder="tarefas.descricao" type="text" id="descricao" maxlength="200">
                <i class="bx bxs-notepad"></i>
            </div>

            <button type="submit" class="login" onclick="criarTarefa()" style="margin-top: 0;" data-i18n="geral.adicionar">Adicionar</button>
        </form>

        <p id="mensagem" style="text-align: center; margin-top: 15px;"></p>

        <ul class="lista" id="lista"></ul>

        <p id="contador" style="text-align: center; font-size: 14px; opacity: .8;"></p>
    </main>

    <script src="auth.js"></script>
    <script>
        async function iniciar() {
            try {
                const resposta = await chamarApi('/perfil');
                if (!resposta) return;

                const dados = await resposta.json();
                if (dados.usuario.idioma !== idiomaAtual()) definirIdioma(dados.usuario.idioma);

                document.getElementById('saudacao').textContent = t('geral.ola', { nome: dados.usuario.nome });
                document.getElementById('conteudo').style.display = 'block';

                await carregarTarefas();

            } catch (erro) {
                alert(t('geral.erroServidor'));
            }
        }

        async function carregarTarefas() {
            const resposta = await chamarApi('/tarefas');
            if (!resposta) return;

            const { tarefas } = await resposta.json();
            const lista = document.getElementById('lista');

            if (tarefas.length === 0) {
                lista.innerHTML = `<li class="vazio">${t('tarefas.vazio')}</li>`;
                document.getElementById('contador').textContent = '';
                return;
            }

            lista.innerHTML = tarefas.map(tarefa => `
                <li class="${tarefa.concluida ? 'concluida' : ''}">
                    <input type="checkbox" ${tarefa.concluida ? 'checked' : ''}
                           onchange="alternar(${tarefa.id}, this.checked)">
                    <div class="texto">
                        <strong>${escapar(tarefa.titulo)}</strong>
                        ${tarefa.descricao ? `<small>${escapar(tarefa.descricao)}</small>` : ''}
                    </div>
                    <i class="bx bx-trash" onclick="excluir(${tarefa.id})" title="${t('geral.excluir')}"></i>
                </li>
            `).join('');

            const pendentes = tarefas.filter(tarefa => !tarefa.concluida).length;
            document.getElementById('contador').textContent =
                t('tarefas.contador', { pendentes, total: tarefas.length });
        }

        async function criarTarefa() {
            const titulo = document.getElementById('titulo').value.trim();
            const descricao = document.getElementById('descricao').value.trim();
            const mensagem = document.getElementById('mensagem');

            if (!titulo) {
                mensagem.textContent = t('tarefas.informeTitulo');
                return;
            }

            const resposta = await chamarApi('/tarefas', {
                method: 'POST',
                body: JSON.stringify({ titulo, descricao })
            });
            if (!resposta) return;

            const dados = await resposta.json();

            if (!resposta.ok) {
                mensagem.textContent = dados.erro;
                return;
            }

            document.getElementById('titulo').value = '';
            document.getElementById('descricao').value = '';
            mensagem.textContent = '';

            await carregarTarefas();
        }

        async function alternar(id, concluida) {
            const resposta = await chamarApi('/tarefas');
            if (!resposta) return;

            const { tarefas } = await resposta.json();
            const tarefa = tarefas.find(item => item.id === id);
            if (!tarefa) return;

            await chamarApi(`/tarefas/${id}`, {
                method: 'PUT',
                body: JSON.stringify({
                    titulo: tarefa.titulo,
                    descricao: tarefa.descricao,
                    concluida
                })
            });

            await carregarTarefas();
        }

        async function excluir(id) {
            if (!confirm(t('tarefas.confirmarExcluir'))) return;

            const resposta = await chamarApi(`/tarefas/${id}`, { method: 'DELETE' });
            if (!resposta) return;

            await carregarTarefas();
        }

        iniciar();
    </script>

</body>
</html>
